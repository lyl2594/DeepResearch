# LLM 配置（OpenAI 兼容）。优先级：环境变量（BASIC_MODEL__<key>）> 本文件。
# 复制为 conf.yaml 后按需修改；真实 base_url / api_key 请勿提交。
# 也可完全不依赖本文件，在 .env 中完整配置（.env.example 有示例）。
BASIC_MODEL:
  base_url: http://your-llm-host:port/v1
  model: Qwen3-32B-FP8
  api_key: "your-api-key"
  token_limit: 32768        # ContextManager 需要；不填则上下文管理失效
  max_retries: 3

# ===== Rerank 重排模型（AIHUB 知识库增强检索用）=====
RERANK_MODEL:
  type: "emb"               # 本地实战配置：emb 格式 /api/emb/rerank；教学默认 dmx
  base_url: "http://your-embedding-host:port/api/emb/embedding"
  model: ""                 # dmx 用；emb 可空
  api_key: ""               # dmx 用；emb 可空
  top_n: 6

# —— 以下能力通过 .env 环境变量配置（本文件仅说明，不生效）——
# SEARCH_API              = duckduckgo(默认,免key) | tavily(需TAVILY_API_KEY) | none(禁用搜索)
# TAVILY_API_KEY          = Tavily 搜索 key
# ENABLE_PYTHON_REPL      = true/false，是否允许 coder 执行 Python 代码（默认 false=安全）
# JINA_API_KEY            = Jina Reader key（爬虫 crawl_tool 用，免 key 有速率限制）